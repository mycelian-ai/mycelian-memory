# ========================================
# LongMemEval Benchmarker Configuration
# ========================================
# This is a complete example configuration with documentation.
# Only dataset_file_path, vault_title, and models are required.
#
# IMPORTANT: Test scope is controlled by the dataset file, not config parameters.
# Create specific dataset files with the desired number of questions/sessions.

# ========================================
# REQUIRED FIELDS
# ========================================

# Path to the LongMemEval dataset JSON file
# The dataset file determines what gets processed:
# - Use small dataset files for testing (e.g., 1 question)
# - Use full dataset files for benchmarking (e.g., 50 questions)
dataset_file_path = "/path/to/longmemeval-datasets/longmemeval_5s.json"

# Vault title for organizing memories in Mycelian
# This creates/uses a vault with this name to store all memories from this run
vault_title = "my-experiment"

# ========================================
# MODEL CONFIGURATION (REQUIRED)
# ========================================
# Format: "provider:model_name"
# Provider MUST be specified: openai, vertex-ai, or openrouter
# 
# Required Environment Variables by Provider:
# - OpenAI: OPENAI_API_KEY
# - Vertex AI: VERTEX_AI_PROJECT_ID + gcloud auth
# - OpenRouter: OPENROUTER_API_KEY

[models]
# REQUIRED: Ingest model for processing conversation sessions
# Default: "openai:gpt-5-nano-2025-08-07"
ingest = "openai:gpt-5-nano-2025-08-07"

# REQUIRED: QA model for answering questions based on retrieved context
# Default: "openai:gpt-5-2025-08-07"
qa = "openai:gpt-5-2025-08-07"

# ========================================
# SEARCH CONFIGURATION (OPTIONAL)
# ========================================

[search]
# Enable two-pass search for better retrieval accuracy
# Two-pass search performs an initial search, analyzes results,
# and optionally does a refined second search for missing information
# Default: true (recommended, especially for models like gpt-5-mini)
use_two_pass = true

# ========================================
# PROVIDER EXAMPLES
# ========================================

# --- OpenAI Models ---
# ingest = "openai:gpt-5-nano-2025-08-07"    # Most cost-effective
# ingest = "openai:gpt-5-mini-2025-08-07"    # Small, fast model
# qa = "openai:gpt-5-2025-08-07"             # More capable for QA
# qa = "openai:gpt-4o"                       # Latest GPT-4 model

# --- Vertex AI Models (Google Cloud) ---
# ingest = "vertex-ai:gemini-2.5-flash-lite" # Fast and efficient
# qa = "vertex-ai:gemini-pro-1.5"            # More capable

# --- OpenRouter Models (Multi-provider gateway) ---
# ingest = "openrouter:openai/gpt-5-nano-2025-08-07"     # OpenAI via OpenRouter
# qa = "openrouter:anthropic/claude-3.5-sonnet"          # Claude via OpenRouter

# --- Mixed Provider Configuration ---
# Use different providers for ingest and QA phases:
# ingest = "vertex-ai:gemini-2.5-flash-lite"             # Efficient for ingestion
# qa = "openrouter:openai/gpt-5-2025-08-07"              # Accurate for QA

# ========================================
# FIXED DEFAULTS (Cannot be changed via config)
# ========================================
# These values are now hardcoded for simplicity:
#
# Provider Configuration:
#   - Always uses OpenAI API
#   - Base URL: https://api.openai.com/v1
#   - Authentication via OPENAI_API_KEY environment variable
#
# Memory Configuration:
#   - memory_title_template: "{question_id}__{run_id}"
#   - vault_id: Auto-generated from vault_title
#
# Search Configuration:
#   - top_k: 10 (number of search results to retrieve)
#
# Processing Scope:
#   - Always processes ALL questions in the dataset
#   - Always processes ALL sessions per question
#   - Always processes ALL turns per session
#   - Control test scope by using appropriate dataset files

# ========================================
# DATASET FILE ORGANIZATION
# ========================================
# Recommended dataset file naming convention:
#   - longmemeval_integ.json    - 1 question for integration testing
#   - longmemeval_1q.json       - Single question with full sessions
#   - longmemeval_5s.json       - 5 questions for small benchmarks
#   - longmemeval_50q.json      - 50 questions for full benchmarks
#   - longmemeval_custom.json   - Custom subset for specific testing

# ========================================
# EXAMPLE CONFIGURATIONS
# ========================================

# Example 1: Quick integration test
# ---------------------------------------------------

# [models]
# ingest = "openai:gpt-4o"
# qa = "openai:gpt-4o"

# ========================================
# ENVIRONMENT VARIABLES
# ========================================
# Model Provider Authentication (set based on providers you use):
#   - OPENAI_API_KEY: OpenAI API key (for OpenAI provider)
#   - VERTEX_AI_PROJECT_ID: Google Cloud project ID (for Vertex AI provider)
#   - OPENROUTER_API_KEY: OpenRouter API key (for OpenRouter provider)
#
# Mycelian Service Configuration:
#   - MEMORY_SERVER_HTTP_PORT: Mycelian server port (default: 11545)
#   - MEMORY_SERVER_SEARCH_INDEX_URL: Weaviate URL (default: from docker-compose)
# Temporal smoke test configuration - tests conversation_time handling with temporal questions
# This config uses entries mode to properly store conversation timestamps

# Path to dataset file
dataset_file_path = "longmemeval-datasets/longmemeval_temporal_smoke.json"

# Vault configuration
vault_title = "longmemeval-temporal-smoke"

# Model configuration - using fast, cheap models for testing
[models]
ingest = "openrouter:openai/gpt-4o-mini"
qa = "openrouter:openai/gpt-4o-mini"

# Search configuration
[search]
use_two_pass = true  # Single pass for smoke test

# Agent configuration
[agent]
context_only = true  # IMPORTANT: Use entries mode to store conversation_time

# Mycelian API configuration
[mycelian]
api_url = "http://localhost:11545/v0"
api_key = "LOCAL_DEV_MODE_NOT_FOR_PRODUCTION"  # pragma: allowlist secret
